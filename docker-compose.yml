version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./skproducts.db
      - SECRET_KEY=sk-secret-key-change-in-production-2024
      - DEBUG=True
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/skproducts.db:/app/skproducts.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped